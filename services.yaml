submit_meter_reading:
  name: Podaj stan wodomierza
  description: Wysyła nowy stan wybranego wodomierza do portalu e-Obywatel. Portal musi udostępniać działający formularz zapisu.
  fields:
    meter:
      name: Wodomierz
      description: Wybierz wodomierz zarejestrowany przez integrację e-Obywatel.
      required: true
      selector:
        entity:
          filter:
            - integration: eobywatel
              domain: sensor
              device_class: water
    reading:
      name: Stan
      description: Nowy stan wodomierza w m³.
      required: true
      example: 104.5
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
